name: 'ga4_ecommerce'
version: '1.0.0'
config-version: 2

profile: 'dbt_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Must match START_DATE / END_DATE in config/settings.py
  start_date: '20201101'
  end_date: '20210131'

models:
  ga4_ecommerce:
    staging:
      +materialized: view
    marts:
      +materialized: table
